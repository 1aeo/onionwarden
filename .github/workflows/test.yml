name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (ubuntu-${{ matrix.ubuntu }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "22.04"]
    steps:
      - uses: actions/checkout@v4

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openssl jq curl bsdmainutils file

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install pytest + cryptography
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest cryptography

      - name: pytest
        run: python3 -m pytest tests/ -q

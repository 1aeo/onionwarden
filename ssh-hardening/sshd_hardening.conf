# onionwarden SSH hardening drop-in (PLAN §6 Phase 2, Q9).
# Installed by apply-ssh-hardening.sh as /etc/ssh/sshd_config.d/60-onionwarden-hardening.conf
#
# Keys-only, no-root, no-password. SSH is the primary remote-attacker (A1)
# entry point and the relays are internet-facing — this is moved up from
# Phase 4 to Phase 2 so the biggest hole is not left open through the rollout.
# After applying, re-baseline `sshd -T` on the host (the ssh check will else
# correctly flag the intended change).

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
PermitEmptyPasswords no

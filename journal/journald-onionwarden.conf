# /etc/systemd/journald.conf.d/10-onionwarden.conf — onionwarden off-box journal
# shipping (PLAN §2.7 / §6, L6). Installed verbatim by scripts/journal-ship-setup.sh.
#
# Off-box shipping closes the log-vacuum gap: `journalctl --vacuum-time=1s` on a
# compromised host wipes local logs silently, but the receiver already holds a
# copy. That only works if the local journal is PERSISTENT (a volatile journal
# is lost on reboot before it can be uploaded) — so this drop-in pins
# Storage=persistent and enables forward-secure sealing (Seal=yes) as a
# tamper-evidence backstop for the on-box copy.
[Journal]
Storage=persistent
Compress=yes
Seal=yes
SystemMaxUse=2G
SystemKeepFree=1G
MaxRetentionSec=2week
# onionwarden ships findings over its own SSH events.log channel; journald does
# not need to fan out to syslog as well.
ForwardToSyslog=no

# /etc/systemd/system/systemd-journal-upload.service.d/10-onionwarden.conf
# onionwarden hardening + resilience for the stock systemd-journal-upload.service
# (PLAN §6, L6). Installed verbatim by scripts/journal-ship-setup.sh.
[Unit]
Description=onionwarden off-box journal upload (L6)
# If the receiver is briefly unreachable, keep retrying — a gap in the off-box
# copy is exactly the window an attacker would use to vacuum the local journal.
StartLimitIntervalSec=0

[Service]
# systemd-journal-upload uses DynamicUser= on Ubuntu/Debian, so it cannot
# safely read 0600 private keys directly from /etc. Let PID 1 copy the mTLS
# material into the unit's private credentials directory, then point curl there.
# BEGIN_MTLS_CREDENTIALS
LoadCredential=upload.key:@CERT_DIR@/upload.key
LoadCredential=upload.crt:@CERT_DIR@/upload.crt
LoadCredential=ca.crt:@CERT_DIR@/ca.crt
ExecStart=
ExecStart=/lib/systemd/systemd-journal-upload --save-state --key=${CREDENTIALS_DIRECTORY}/upload.key --cert=${CREDENTIALS_DIRECTORY}/upload.crt --trust=${CREDENTIALS_DIRECTORY}/ca.crt
# END_MTLS_CREDENTIALS
Restart=always
RestartSec=30
# A stuck or hostile uploader must not starve the relay.
Nice=10
CPUWeight=20
MemoryMax=256M
# State cursor lives under /var/lib/systemd/journal-upload; nothing else is written.
ProtectSystem=strict
ReadWritePaths=/var/lib/systemd/journal-upload
ProtectHome=true
NoNewPrivileges=true
# Defense-in-depth: shrink the kernel/syscall/namespace surface available to a
# compromised uploader (it only needs to read the journal and speak https).
PrivateTmp=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=true
LockPersonality=true
RestrictRealtime=true
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
RemoveIPC=true

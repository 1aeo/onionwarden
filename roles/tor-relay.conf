# roles/tor-relay.conf — tor-relay role profile (PLAN §0.6).
# A relay opens outbound connections to thousands of arbitrary IPs by design,
# so the outbound check is re-scoped to "anything OTHER than tor" — connections
# owned by the tor.service systemd cgroup are excluded. `freeze` is a full
# service outage on a relay (H6): the role recommends `alert`/`poweroff`.
role_label               = "tor-relay"
workload_integrity_check = "hashes"
outbound_mode            = "exclude-process"
outbound_exclude_unit    = "tor.service"
extra_integrity_paths    = ["/etc/tor/torrc", "/etc/tor"]
tor_integrity_check      = true
fatal_action             = "alert"
fatal_signals_extra      = ["tor_identity_key", "torrc_change"]

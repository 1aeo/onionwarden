# roles/eval-host.conf — eval/CI host role profile (PLAN §0.6).
# An eval host should mostly talk to a known LAN, so outbound is strictly
# allowlisted. Live nested-VM disks churn, so disk-image content hashing is
# off — but the Nested-VM-layer check (§2.4) stays on regardless.
role_label               = "eval-host"
workload_integrity_check = "none"
outbound_mode            = "allowlist"
fatal_action             = "alert"
